<!DOCTYPE html>
<html lang="de">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Engine Control Unit</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<style>

:root{
    --primary:#0063B1;
    --green:#16A34A;
    --light:#F5F7FA;
}

body{
    background:var(--light);
    font-family:'Segoe UI',sans-serif;
}

.hero{
    background:#0063B1;
    color:white;
    padding:50px;
    border-radius:25px;
    margin-bottom:30px;
}

.card{
    border:none;
    border-radius:20px;
    box-shadow:0 4px 20px rgba(0,0,0,0.08);
}

.kpi{
    background:white;
    border-radius:20px;
    text-align:center;
    padding:20px;
    height:100%;
}

.kpi-value{
    font-size:2rem;
    font-weight:bold;
    color:#16A34A;
}

.product-image{
    max-height:400px;
    width:auto;
    display:block;
    margin:auto;
}

.section-title{
    font-weight:700;
    margin-bottom:20px;
}

.score-circle{
    width:160px;
    height:160px;
    border-radius:50%;
    background:#16A34A;
    color:white;
    font-size:2rem;
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:auto;
}

</style>

</head>

<body>

<div class="container py-4">

    <div class="hero">

        <h1>AT&S - Digital Product Passport</h1>

        <h2>WCF0282</h2>

        <h2>Engine Control Unit</h2>

        <span class="badge bg-success">Traceable</span>
        <span class="badge bg-success">RoHS</span>
        <span class="badge bg-primary">Sustainable</span>

    </div>

    <div class="row mb-4">

        <div class="col-md-4 mb-3">
            <div class="kpi">
                <div class="kpi-value">8</div>
                Layers
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="kpi">
                <div class="kpi-value">5.5</div>
                kg CO₂e
            </div>
